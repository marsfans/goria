# goria 配置文件: 放在 ./goria.yaml 或 ~/.config/goria/goria.yaml, 或用 --conf 指定
# 优先级: 命令行参数 > 环境变量 GORIA_* > 配置文件 > 默认值
dir: ./downloads
split: 16                      # 每个任务连接数
max-concurrent-downloads: 3    # 同时任务数
max-speed: 0                   # 全局限速, 如 5M
max-tries: 5
min-split-size: 1M
user-agent: goria/1.0
# all-proxy: socks5://127.0.0.1:1080
# header:
#   - "Referer: https://example.com"
# curl 兼容参数同样可写 (键名即长参数名), 如:
# referer: https://example.com
# cookie: "sid=42"
# user: "alice:secret"
# connect-timeout: 10
# max-time: 600
# retry-delay: 2
# data:
#   - "a=1"
# sftp-private-key: ~/.ssh/id_ed25519   # SFTP 登录私钥
# http11: false        # 强制 HTTP/1.1 (命令行 --http1.1)
# http2: false         # 要求协商出 HTTP/2
# http3: false         # 先试 HTTP/3 再回落
# http3-only: false
seed-ratio: 0                  # BT 做种分享率
listen-port: 0
# save-session: ~/.config/goria/session.json   # 会话文件: 保存未完成任务, 用 goria resume 恢复 (空 关闭)
